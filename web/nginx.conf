server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # DNS interno de Docker: resuelve "api" en cada petición, así Nginx arranca
    # aunque la API todavía no esté lista (antes se caía y el 8081 no abría).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Descargas de respaldos: pueden ser grandes y tardar en generarse; sin búfer y con más tiempo
    location /api/respaldos/descarga/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API (contenedor obras_api)
    location /api {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
